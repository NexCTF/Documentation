name: Screenshots
on:
  workflow_dispatch:
    inputs:
      ref:
        description: NexCTF tag or branch to capture
        required: true
        default: main
      plugins:
        description: Plugins to install first (NEXCTF_PLUGINS), for the plugin list
        required: false
        default: ""
permissions:
  contents: write
  pull-requests: write
jobs:
  capture:
    runs-on: ubuntu-latest
    # Credentials match NexCTF's .env.dev, which its backend reads through the Taskfile.
    services:
      db:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: changethis
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      cache:
        image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      s3:
        image: ghcr.io/coollabsio/maxio:0.4.2@sha256:2e7fc2a32d66fb31c44ce366e8a289218d3c38fcbe25bd6fa575b4df7c0e0272
        env:
          MAXIO_ACCESS_KEY: admin
          MAXIO_SECRET_KEY: admin
          MAXIO_DEFAULT_BUCKETS: nexctf
        ports:
          - 9000:9000
      mail:
        image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: "1"
          MP_SMTP_AUTH_ALLOW_INSECURE: "1"
        ports:
          - 1025:1025
          - 8025:8025
    env:
      NEXCTF_REF: ${{ inputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The screenshots are stored in Git LFS.
          lfs: true
      - uses: actions/checkout@v7
        with:
          repository: NexCTF/NexCTF
          ref: ${{ inputs.ref }}
          path: nexctf
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install Task
        run: curl -sSfL https://taskfile.dev/install.sh | sudo sh -s -- -b /usr/local/bin
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends webp
      - run: uv sync --frozen
        working-directory: nexctf/backend
      - run: bun install --frozen-lockfile
        working-directory: nexctf/frontend
      - run: bunx playwright install --with-deps chromium
        working-directory: nexctf/frontend
      # What `task dev:screenshots` does locally; the services start empty, so only the database is missing.
      - run: docker exec ${{ job.services.db.id }} psql -U postgres -c "CREATE DATABASE nexctf_screenshots"
      # Playwright starts the backend (migrations + dev fixtures), the worker and the frontend.
      - run: bunx playwright test -c playwright.screenshots.config.ts docs/
        working-directory: nexctf/frontend
        env:
          NEXCTF_PLUGINS: ${{ inputs.plugins }}
          SCREENSHOTS_DOCS_DIR: ${{ runner.temp }}/docshots
      - run: scripts/update-screenshots.sh "$RUNNER_TEMP/docshots"
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- docs/assets/images; then
            echo "screenshots unchanged"
            exit 0
          fi
          branch="screenshots/${NEXCTF_REF//\//-}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add docs/assets/images
          git commit -m "Update screenshots for NexCTF $NEXCTF_REF"
          git push origin "$branch"
          gh pr create --title "Update screenshots for NexCTF $NEXCTF_REF" \
            --body "Captured from NexCTF \`$NEXCTF_REF\` by the Screenshots workflow."
