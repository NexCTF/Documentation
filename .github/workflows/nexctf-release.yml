name: NexCTF release
# Started by NexCTF when it publishes a release (or by hand): refreshes the API
# reference and the screenshots from that version, and opens a pull request.
on:
  workflow_dispatch:
    inputs:
      version:
        description: NexCTF release tag, e.g. v0.12.3
        required: true
      plugins:
        description: Plugins installed for the screenshots (NEXCTF_PLUGINS)
        required: false
        default: nexctf-sandbox==1.0.0
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: nexctf-release-${{ inputs.version }}
jobs:
  update:
    runs-on: ubuntu-latest
    # Credentials match NexCTF's .env.dev, which its backend reads through the Taskfile.
    services:
      db:
        image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: changethis
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      cache:
        image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      s3:
        image: ghcr.io/coollabsio/maxio:0.4.2@sha256:2e7fc2a32d66fb31c44ce366e8a289218d3c38fcbe25bd6fa575b4df7c0e0272
        env:
          MAXIO_ACCESS_KEY: admin
          MAXIO_SECRET_KEY: admin
          MAXIO_DEFAULT_BUCKETS: nexctf
        ports:
          - 9000:9000
      mail:
        image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: "1"
          MP_SMTP_AUTH_ALLOW_INSECURE: "1"
        ports:
          - 1025:1025
          - 8025:8025
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The screenshots are stored in Git LFS.
          lfs: true
      - uses: actions/checkout@v7
        with:
          repository: NexCTF/NexCTF
          ref: ${{ inputs.version }}
          path: nexctf
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install Task
        run: curl -sSfL https://taskfile.dev/install.sh | sudo sh -s -- -b /usr/local/bin
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends webp
      - run: uv sync --frozen
        working-directory: nexctf/backend
      - run: bun install --frozen-lockfile
        working-directory: nexctf/frontend
      - run: bunx playwright install --with-deps chromium
        working-directory: nexctf/frontend

      # Before the screenshots, whose plugins would otherwise be installed in the backend.
      - name: Update the API reference
        working-directory: nexctf
        run: |
          WEB_CONCURRENCY=1 setsid task dev:backend > "$RUNNER_TEMP/backend.log" 2>&1 &
          backend=$!
          if ! timeout 180 bash -c 'until curl -sf localhost:8000/api/v1/info > /dev/null; do sleep 2; done'; then
            cat "$RUNNER_TEMP/backend.log"
            exit 1
          fi
          ../scripts/update-openapi.sh http://localhost:8000 "$VERSION"
          # The screenshots start their own backend on the same port.
          kill -- "-$backend"
          timeout 30 bash -c 'while curl -sf localhost:8000/api/v1/info > /dev/null; do sleep 1; done'

      # What `task dev:screenshots` does locally; the services start empty, so only the database is missing.
      - run: docker exec ${{ job.services.db.id }} psql -U postgres -c "CREATE DATABASE nexctf_screenshots"
      # Playwright starts the backend (migrations + dev fixtures), the worker and the frontend.
      - name: Capture the screenshots
        working-directory: nexctf/frontend
        run: bunx playwright test -c playwright.screenshots.config.ts --project docs
        env:
          NEXCTF_PLUGINS: ${{ inputs.plugins }}
          SCREENSHOTS_DOCS_DIR: ${{ runner.temp }}/docshots
      - run: scripts/update-screenshots.sh "$RUNNER_TEMP/docshots"

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- docs/api docs/assets/images; then
            echo "nothing changed for NexCTF $VERSION"
            exit 0
          fi
          release="NexCTF ${VERSION#v}"
          branch="nexctf/$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add docs/api docs/assets/images
          # Images must go through LFS: a raw binary in history cannot be taken back.
          for image in $(git diff --cached --name-only -- docs/assets/images); do
            git cat-file -p ":$image" | head -c 40 | grep -q "^version https://git-lfs" \
              || { echo "$image is not stored in LFS"; exit 1; }
          done
          git commit -m "$release"
          # A re-run replaces the branch and keeps its pull request.
          git push --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --json number --jq '.[]')" ]; then
            gh pr create --title "$release" \
              --body "API reference and screenshots regenerated from NexCTF \`$VERSION\` by the NexCTF release workflow."
          fi
